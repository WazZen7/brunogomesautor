<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Livro | Bruno Gomes</title>
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Cliente Oficial do Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-main: #0a0c10;
            --bg-card: rgba(10, 12, 16, 0.65);
            --border-card: rgba(255, 255, 255, 0.08);
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.35);
            --accent: #a855f7;
            --text-title: #ffffff;
            --text-body: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-body);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 4rem;
        }

        h1, h2, h3, h4 {
            font-family: 'Syne', sans-serif;
            color: var(--text-title);
        }

        /* BRILHO DE FUNDO */
        .glow-bg {
            position: fixed;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, var(--primary-glow) 0%, rgba(0,0,0,0) 70%);
            z-index: -1;
            pointer-events: none;
            filter: blur(100px);
        }

        /* NAVEGAÇÃO */
        nav {
            max-width: 1100px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-link {
            color: var(--text-body);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.95rem;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: #fff;
        }

        .author-tag {
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--primary);
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        /* CARTÃO PRINCIPAL */
        .hero-card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 28px;
            padding: 3rem;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 3.5rem;
            align-items: center;
            margin-top: 1rem;
            margin-bottom: 3.5rem;
        }

        /* ÁREA E COMPONENTE LIVRO 3D (Sem barras ou sobreposições brancas) */
        .book-visual {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 440px;
            perspective: 1200px;
        }

        .book-3d-wrapper {
            position: relative;
            width: 230px;
            height: 340px;
            transform-style: preserve-3d;
            transform: rotateY(-25deg) rotateX(10deg);
            transition: transform 0.2s cubic-bezier(0.25, 1, 0.5, 1);
            cursor: pointer;
        }

        /* Capa Frontal Limpa */
        .book-cover {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1e1b4b 0%, #311042 50%, #0f172a 100%);
            border-radius: 3px 10px 10px 3px;
            box-shadow: inset 4px 0 10px rgba(0, 0, 0, 0.4), 0 10px 25px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transform: translateZ(20px);
            backface-visibility: hidden;
            overflow: hidden;
            z-index: 2;
        }

        .cover-badge {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent);
            font-weight: 700;
            display: block;
            margin-bottom: 0.2rem;
        }

        .cover-title {
            font-size: 1.6rem;
            line-height: 1.1;
            color: #ffffff;
            margin: 0.5rem 0;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .cover-author {
            font-size: 0.8rem;
            color: #cbd5e1;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Lombada (Spine) */
        .book-spine {
            position: absolute;
            width: 40px;
            height: 100%;
            left: 0;
            background: linear-gradient(90deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            transform: rotateY(-90deg) translateZ(20px);
            border-radius: 3px 0 0 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-left: 1px solid rgba(255, 255, 255, 0.08);
        }

        .spine-text {
            color: #e2e8f0;
            font-size: 0.75rem;
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            letter-spacing: 2px;
            writing-mode: vertical-rl;
            text-transform: uppercase;
            transform: rotate(180deg);
            opacity: 0.85;
        }

        /* Páginas Internas */
        .book-pages-right {
            position: absolute;
            width: 38px;
            height: 96%;
            top: 2%;
            right: 0;
            background: linear-gradient(90deg, #334155 0%, #475569 70%, #1e293b 100%);
            transform: rotateY(90deg) translateZ(210px);
            border-radius: 2px;
            box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.4);
        }

        .book-pages-top {
            position: absolute;
            width: 226px;
            height: 38px;
            top: 0;
            left: 2px;
            background: linear-gradient(180deg, #334155 0%, #1e293b 100%);
            transform: rotateX(90deg) translateZ(19px);
            border-radius: 2px;
        }

        /* Sombra do Livro */
        .book-shadow {
            position: absolute;
            width: 220px;
            height: 20px;
            bottom: -30px;
            left: 10px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 50%;
            filter: blur(15px);
            transform: rotateX(80deg) rotateZ(-5deg);
            pointer-events: none;
            transition: transform 0.2s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* DETALHES E ELEMENTOS */
        .genre-badge {
            display: inline-block;
            background: rgba(99, 102, 241, 0.15);
            color: var(--primary);
            border: 1px solid rgba(99, 102, 241, 0.3);
            padding: 0.35rem 1rem;
            border-radius: 100px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .book-title {
            font-size: clamp(2rem, 3.5vw, 3rem);
            line-height: 1.15;
            margin-bottom: 0.75rem;
        }

        .book-subtitle {
            font-size: 1.1rem;
            color: #cbd5e1;
            margin-bottom: 2rem;
            font-weight: 300;
        }

        .cta-group {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: #fff;
            padding: 0.9rem 2rem;
            border-radius: 100px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px var(--primary-glow);
            border: none;
            cursor: pointer;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px var(--primary-glow);
        }

        .btn-secondary {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            padding: 0.9rem 1.8rem;
            border-radius: 100px;
            text-decoration: none;
            font-weight: 600;
            border: 1px solid var(--border-card);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* GRELHA DE DETALHES */
        .details-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.25rem;
            margin-bottom: 3.5rem;
        }

        .detail-card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            padding: 1.5rem;
            border-radius: 20px;
            backdrop-filter: blur(12px);
            text-align: center;
        }

        .detail-card i {
            font-size: 1.4rem;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .detail-card h4 {
            color: var(--text-title);
            font-size: 1rem;
            margin-bottom: 0.2rem;
        }

        /* SECÇÃO FUTUROS LIVROS */
        .future-books-section {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            padding: 2.5rem;
            border-radius: 24px;
            backdrop-filter: blur(12px);
            margin-bottom: 3.5rem;
        }

        .section-title {
            font-size: 1.8rem;
            margin-bottom: 1rem;
        }

        .future-card {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            background: rgba(255, 255, 255, 0.02);
            border: 1px dashed var(--border-card);
            padding: 1.5rem;
            border-radius: 16px;
            margin-top: 1rem;
        }

        .future-card i {
            font-size: 2rem;
            color: var(--accent);
        }

        /* SECÇÃO DE OPINIÕES DO LEITOR */
        .reviews-section {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            padding: 2.5rem;
            border-radius: 24px;
            backdrop-filter: blur(12px);
        }

        .review-form {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            margin-top: 1.5rem;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .input-field, .textarea-field, .select-field {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-card);
            border-radius: 12px;
            padding: 0.85rem 1.25rem;
            color: #fff;
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .input-field:focus, .textarea-field:focus, .select-field:focus {
            border-color: var(--primary);
        }

        .textarea-field {
            resize: vertical;
            min-height: 110px;
        }

        .reviews-container {
            margin-top: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .review-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-card);
            border-radius: 16px;
            padding: 1.25rem 1.5rem;
        }

        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .review-author {
            font-weight: 600;
            color: #fff;
        }

        .review-rating {
            color: #f59e0b;
            font-size: 0.9rem;
        }

        .review-text {
            font-size: 0.95rem;
            color: var(--text-body);
        }

        /* JANELA MODAL DA SINOPSE */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        .modal-content {
            background: #0f131a;
            border: 1px solid var(--border-card);
            border-radius: 24px;
            padding: 2.5rem;
            max-width: 650px;
            width: 100%;
            position: relative;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .close-modal {
            position: absolute;
            top: 1.25rem;
            right: 1.
