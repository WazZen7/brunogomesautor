<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bruno Gomes | Autor de Thriller & Crime</title>
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-main: #0a0c10;
            --border-card: rgba(255, 255, 255, 0.08);
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.35);
            --accent: #a855f7;
            --text-title: #ffffff;
            --text-body: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-body);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        h1 {
            font-family: 'Syne', sans-serif;
            color: var(--text-title);
        }

        /* BRILHO DE FUNDO */
        .glow-bg {
            position: fixed;
            top: 50%;
            left: 75%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, var(--primary-glow) 0%, rgba(0,0,0,0) 70%);
            z-index: -1;
            pointer-events: none;
            filter: blur(90px);
        }

        /* CONTAINER DE DUAS COLUNAS */
        .main-container {
            display: flex;
            width: 100%;
            min-height: 100vh;
            z-index: 2;
        }

        /* COLUNA ESQUERDA: A TUA FOTO */
        .left-panel {
            flex: 1;
            min-height: 100vh;
            background-image: 
                linear-gradient(180deg, rgba(10, 12, 16, 0.15) 0%, rgba(10, 12, 16, 0.40) 100%),
                url('./minha-foto-ia.png');
            background-size: cover;
            background-position: left center;
            background-repeat: no-repeat;
            position: relative;
        }

        .left-panel::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 250px;
            height: 100%;
            background: linear-gradient(to right, rgba(10, 12, 16, 0) 0%, rgba(10, 12, 16, 1) 100%);
        }

        /* COLUNA DIREITA: LIVRO & CONTEÚDO */
        .right-panel {
            flex: 1;
            background-color: #0a0c10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 3rem 2rem;
            position: relative;
        }

        /* ESTRUTURA DO LIVRO E FOLHEADO (SEM ROTAÇÃO NO ESPAÇO) */
        .book-wrapper {
            perspective: 1200px;
            margin-bottom: 2.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .book-container {
            width: 210px;
            height: 290px;
            position: relative;
            transform-style: preserve-3d;
            /* Livro fixo, sem rotações 3D de perspetiva externa */
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
            border-radius: 4px 10px 10px 4px;
        }

        /* FOLHAS DO LIVRO */
        .leaf {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            transform-origin: left center;
            transform-style: preserve-3d;
            border-radius: 2px 8px 8px 2px;
            animation: flipPage 12s infinite cubic-bezier(0.45, 0.05, 0.55, 0.95);
        }

        /* FACES DAS FOLHAS (FRENTE E VERSO) */
        .page-front, .page-back {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            backface-visibility: hidden;
            border-radius: 2px 8px 8px 2px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 1.5rem;
            box-shadow: inset 3px 0 10px rgba(0,0,0,0.1);
        }

        .page-back {
            transform: rotateY(180deg);
        }

        /* CAPA INICIAL */
        .cover-front {
            background: linear-gradient(135deg, #111827 0%, #030712 100%);
            border-left: 6px solid #374151;
            border: 1px solid rgba(255,255,255,0.15);
            text-align: center;
            color: #fff;
            align-items: center;
        }

        .cover-front h3 {
            font-family: 'Syne', sans-serif;
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
        }

        .cover-front p {
            font-size: 0.85rem;
            color: var(--text-body);
        }

        /* PÁGINAS INTERNAS (TEXTO SIMULADO) */
        .page-paper {
            background: #f8fafc;
            color: #1e293b;
        }

        .line {
            height: 4px;
            background: #cbd5e1;
            margin-bottom: 9px;
            border-radius: 2px;
        }
        .line.short { width: 50%; }
        .line.medium { width: 75%; }

        /* CONTRACAPA FINAL */
        .cover-back {
            background: linear-gradient(135deg, #0f172a 0%, #020617 100%);
            border-right: 6px solid #374151;
            border: 1px solid rgba(255,255,255,0.1);
            text-align: center;
            color: #64748b;
            font-size: 0.8rem;
            align-items: center;
        }

        /* ESCALONAMENTO DO TEMPO DE FOLHEADO */
        .leaf-1 { z-index: 5; animation-delay: 0s; }
        .leaf-2 { z-index: 4; animation-delay: 2.5s; }
        .leaf-3 { z-index: 3; animation-delay: 5s; }
        .leaf-4 { z-index: 2; animation-delay: 7.5s; }

        /* ANIMAÇÃO DE FOLHEAR PÁGINA A PÁGINA */
        @keyframes flipPage {
            0% {
                transform: rotateY(0deg);
            }
            15% {
                transform: rotateY(-180deg);
            }
            70% {
                transform: rotateY(-180deg);
            }
            85% {
                transform: rotateY(0deg);
            }
            100% {
                transform: rotateY(0deg);
            }
        }

        /* TEXTO E BOTÃO */
        .hero {
            text-align: center;
            max-width: 500px;
            z-index: 2;
        }

        .hero-title {
            font-size: clamp(1.6rem, 3vw, 2.5rem);
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        .hero-title span {
            background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-bio {
            font-size: 1rem;
            color: var(--text-body);
            margin-bottom: 2rem;
            font-weight: 300;
        }

        .btn-enter {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: #fff;
            padding: 0.9rem 2.4rem;
            border-radius: 100px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px var(--primary-glow);
        }

        .btn-enter:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px var(--primary-glow);
        }

        /* RESPONSIVIDADE TELEMÓVEL */
        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
            }

            .left-panel {
                flex: none;
                height: 50vh;
                background-position: center;
            }

            .left-panel::after {
                width: 100%;
                height: 120px;
                background: linear-gradient(to bottom, rgba(10, 12, 16, 0) 0%, rgba(10, 12, 16, 1) 100%);
                top: auto;
                bottom: 0;
            }

            .right-panel {
                padding: 2rem 1.5rem;
            }

            .book-container {
                width: 170px;
                height: 240px;
            }
        }
    </style>
</head>
<body>

    <div class="glow-bg"></div>

    <div class="main-container">
        <!-- COLUNA ESQUERDA: A TUA FOTO -->
        <div class="left-panel"></div>

        <!-- COLUNA DIREITA: LIVRO PARADO A FOLHEAR E TEXTO -->
        <div class="right-panel">
            
            <!-- ESTRUTURA DE FOLHEAR O LIVRO -->
            <div class="book-wrapper">
                <div class="book-container">
                    
                    <!-- FOLHA 1: CAPA INICIAL DA FRENTE -->
                    <div class="leaf leaf-1">
                        <div class="page-front cover-front">
                            <h3>Na Teia do Crime</h3>
                            <p>Bruno Gomes</p>
                        </div>
                        <div class="page-back page-paper">
                            <div class="line medium"></div>
                            <div class="line"></div>
                            <div class="line short"></div>
                        </div>
                    </div>

                    <!-- FOLHA 2: PÁGINA INTERNA 1 -->
                    <div class="leaf leaf-2">
                        <div class="page-front page-paper">
                            <div class="line"></div>
                            <div class="line short"></div>
                            <div class="line medium"></div>
                        </div>
                        <div class="page-back page-paper">
                            <div class="line medium"></div>
                            <div class="line"></div>
                            <div class="line"></div>
                        </div>
                    </div>

                    <!-- FOLHA 3: PÁGINA INTERNA 2 -->
                    <div class="leaf leaf-3">
                        <div class="page-front page-paper">
                            <div class="line medium"></div>
                            <div class="line short"></div>
                            <div class="line"></div>
                        </div>
                        <div class="page-back page-paper">
                            <div class="line"></div>
                            <div class="line short"></div>
                            <div class="line medium"></div>
                        </div>
                    </div>

                    <!-- FOLHA 4: CONTRACAPA FINAL -->
                    <div class="leaf leaf-4">
                        <div class="page-front page-paper">
                            <div class="line"></div>
                            <div class="line medium"></div>
                            <div class="line short"></div>
                        </div>
                        <div class="page-back cover-back">
                            <p>— Contracapa —</p>
                        </div>
                    </div>

                </div>
            </div>

            <!-- TEXTO E BOTÃO ABAIXO -->
            <section class="hero">
                <h1 class="hero-title"><span>Nas sombras, a verdade nunca fica enterrada.</span></h1>
                
                <p class="hero-bio">
                    Sou o Bruno Gomes. Escrevo histórias sobre segredos sombrios, mentes complexas e os mistérios que habitam no limiar entre a justiça e a vingança. Prepara-te para duvidar de tudo.
                </p>
                
                <a href="livro.html" class="btn-enter">
                    Descobrir o Livro <i class="fa-solid fa-arrow-right"></i>
                </a>
            </section>

        </div>
    </div>

</body>
</html>
