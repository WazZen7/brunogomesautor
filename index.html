<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bruno Gomes | Autor de Thriller & Crime</title>
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-main: #0a0c10;
            --border-card: rgba(255, 255, 255, 0.08);
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.35);
            --accent: #a855f7;
            --text-title: #ffffff;
            --text-body: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-body);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding: 1.5rem;
            position: relative;

            /* IMAGEM DE FUNDO DO AUTOR (À ESQUERDA) */
            background-image: 
                linear-gradient(180deg, rgba(10, 12, 16, 0.70) 0%, rgba(10, 12, 16, 0.88) 100%),
                url('./minha-foto-ia.png');
            background-size: contain;
            background-position: left center;
            background-repeat: no-repeat;
        }

        h1 {
            font-family: 'Syne', sans-serif;
            color: var(--text-title);
        }

        /* BRILHO DE FUNDO */
        .glow-bg {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, var(--primary-glow) 0%, rgba(0,0,0,0) 70%);
            z-index: -1;
            pointer-events: none;
            filter: blur(90px);
        }

        /* CONTENTOR DE LAYOUT COMPLETO */
        .page-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 1500px;
            z-index: 2;
            gap: 2rem;
        }

        /* ESPAÇADOR À ESQUERDA PARA MOSTRAR A TUA FOTO */
        .left-spacer {
            flex: 1;
            min-width: 250px;
        }

        /* CARTÃO DE TEXTO AO CENTRO (HERO) */
        .hero {
            text-align: center;
            padding: 2.5rem;
            width: 100%;
            max-width: 520px;
            background: rgba(10, 12, 16, 0.65);
            border: 1px solid var(--border-card);
            border-radius: 24px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            z-index: 3;
        }

        .hero-title {
            font-size: clamp(1.8rem, 4vw, 3rem);
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        .hero-title span {
            background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-bio {
            font-size: 1.05rem;
            color: var(--text-body);
            margin-bottom: 2.2rem;
            font-weight: 300;
        }

        .btn-enter {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: #fff;
            padding: 1rem 2.5rem;
            border-radius: 100px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.05rem;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px var(--primary-glow);
        }

        .btn-enter:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px var(--primary-glow);
        }

        /* SECÇÃO DO LIVRO 3D (MAIOR E BEM À DIREITA) */
        .book-section {
            flex: 0 0 380px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding-right: 2rem;
        }

        .book-scene {
            width: 260px;
            height: 380px;
            perspective: 1400px;
        }

        /* LIVRO 3D COM ROTAÇÃO 360° CONTÍNUA */
        .book-3d-model {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            animation: rotateBook360 16s infinite linear;
        }

        @keyframes rotateBook360 {
            0% {
                transform: rotateX(10deg) rotateY(0deg);
            }
            100% {
                transform: rotateX(10deg) rotateY(-360deg);
            }
        }

        /* FACES DO LIVRO 3D (EFEITO DE CAIXA/VOLUME) */
        .book-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 4px 10px 10px 4px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            box-sizing: border-box;
        }

        /* CAPA (FRENTE) */
        .face-front {
            background: linear-gradient(135deg, #111827 0%, #030712 100%);
            border-left: 8px solid #374151;
            border: 1px solid rgba(255,255,255,0.15);
            padding: 2rem;
            color: #fff;
            transform: translateZ(25px);
            box-shadow: inset 6px 0 15px rgba(0,0,0,0.6);
        }

        .face-front h3 {
            font-family: 'Syne', sans-serif;
            font-size: 1.5rem;
            margin-bottom: 0.6rem;
        }

        .face-front p {
            font-size: 0.95rem;
            color: var(--text-body);
        }

        /* CONTRACAPA (VERSO) */
        .face-back {
            background: linear-gradient(135deg, #0f172a 0%, #020617 100%);
            border-right: 8px solid #374151;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 2rem;
            color: #64748b;
            transform: rotateY(180deg) translateZ(25px);
            box-shadow: inset -6px 0 15px rgba(0,0,0,0.6);
        }

        .face-back p {
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        /* LOMBADA DO LIVRO (ESQUERDA) */
        .face-spine {
            position: absolute;
            top: 0;
            left: 0;
            width: 50px;
            height: 100%;
            background: linear-gradient(90deg, #1e293b 0%, #0f172a 100%);
            transform: rotateY(-90deg) translateZ(25px);
            transform-origin: left;
            border-right: 1px solid rgba(255,255,255,0.05);
        }

        /* PÁGINAS (BLOCO LATERAL / DIREITA) */
        .face-pages {
            position: absolute;
            top: 2px;
            right: 0;
            width: 48px;
            height: calc(100% - 4px);
            background: #f8fafc;
            transform: rotateY(90deg) translateZ(calc(260px - 25px));
            transform-origin: right;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
            background-image: repeating-linear-gradient(0deg, #e2e8f0, #e2e8f0 2px, #f8fafc 2px, #f8fafc 4px);
        }

        /* RESPONSIVIDADE */
        @media (max-width: 1200px) {
            .left-spacer {
                display: none;
            }
            .page-wrapper {
                justify-content: center;
                flex-wrap: wrap;
            }
            .book-section {
                justify-content: center;
                padding-right: 0;
            }
        }

        @media (max-width: 768px) {
            body {
                background-size: cover;
                background-position: center top;
                padding: 1rem;
            }

            .page-wrapper {
                flex-direction: column;
            }

            .hero {
                padding: 1.75rem 1.25rem;
                background: rgba(10, 12, 16, 0.80);
            }

            .hero-title {
                font-size: 1.8rem;
            }

            .hero-bio {
                font-size: 1rem;
                margin-bottom: 1.75rem;
            }

            .btn-enter {
                width: 100%;
            }

            .book-section {
                order: -1;
                margin-bottom: 1.5rem;
            }

            .book-scene {
                width: 200px;
                height: 290px;
            }

            .face-spine {
                width: 40px;
                transform: rotateY(-90deg) translateZ(20px);
            }

            .face-front, .face-back {
                transform: translateZ(20px);
            }

            .face-back {
                transform: rotateY(180deg) translateZ(20px);
            }

            .face-pages {
                width: 38px;
                transform: rotateY(90deg) translateZ(calc(200px - 20px));
            }
        }
    </style>
</head>
<body>

    <div class="glow-bg"></div>

    <div class="page-wrapper">
        
        <!-- ESPAÇADOR À ESQUERDA PARA MOSTRAR A TUA FOTO -->
        <div class="left-spacer"></div>

        <!-- CARTÃO DO AUTOR AO CENTRO -->
        <section class="hero">
            <h1 class="hero-title"><span>Nas sombras, a verdade nunca fica enterrada.</span></h1>
            
            <p class="hero-bio">
                Sou o Bruno Gomes. Escrevo histórias sobre segredos sombrios, mentes complexas e os mistérios que habitam no limiar entre a justiça e a vingança. Prepara-te para duvidar de tudo.
            </p>
            
            <a href="livro.html" class="btn-enter">
                Descobrir o Livro <i class="fa-solid fa-arrow-right"></i>
            </a>
        </section>

        <!-- LIVRO 3D A ROTAÇÃO COMPLETA MAIOR E MAIS À DIREITA -->
        <div class="book-section">
            <div class="book-scene">
                <div class="book-3d-model">
                    
                    <!-- CAPA (FRENTE) -->
                    <div class="book-face face-front">
                        <h3>Na Teia do Crime</h3>
                        <p>Bruno Gomes</p>
                    </div>

                    <!-- CONTRACAPA (VERSO) -->
                    <div class="book-face face-back">
                        <p>— Contracapa —</p>
                    </div>

                    <!-- LOMBADA -->
                    <div class="book-face face-spine"></div>

                    <!-- PÁGINAS DO BLOCO LATERAL -->
                    <div class="book-face face-pages"></div>

                </div>
            </div>
        </div>

    </div>

</body>
</html>
