<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bruno Gomes | Autor de Thriller & Crime</title>
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-main: #0a0c10;
            --border-card: rgba(255, 255, 255, 0.08);
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.35);
            --accent: #a855f7;
            --text-title: #ffffff;
            --text-body: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-body);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding: 1.5rem;
            position: relative;

            /* IMAGEM DE FUNDO DO AUTOR (À ESQUERDA) */
            background-image: 
                linear-gradient(180deg, rgba(10, 12, 16, 0.70) 0%, rgba(10, 12, 16, 0.88) 100%),
                url('./minha-foto-ia.png');
            background-size: contain;
            background-position: left center;
            background-repeat: no-repeat;
        }

        h1 {
            font-family: 'Syne', sans-serif;
            color: var(--text-title);
        }

        /* BRILHO DE FUNDO */
        .glow-bg {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, var(--primary-glow) 0%, rgba(0,0,0,0) 70%);
            z-index: -1;
            pointer-events: none;
            filter: blur(90px);
        }

        /* CONTENTOR DE LAYOUT COMPLETO */
        .page-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 1500px;
            z-index: 2;
            gap: 2rem;
        }

        /* ESPAÇADOR À ESQUERDA PARA MOSTRAR A TUA FOTO */
        .left-spacer {
            flex: 1;
            min-width: 220px;
        }

        /* CARTÃO DE TEXTO AO CENTRO (HERO) */
        .hero {
            text-align: center;
            padding: 2.5rem;
            width: 100%;
            max-width: 520px;
            background: rgba(10, 12, 16, 0.75);
            border: 1px solid var(--border-card);
            border-radius: 24px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            z-index: 3;
        }

        .hero-title {
            font-size: clamp(1.8rem, 4vw, 3rem);
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        .hero-title span {
            background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-bio {
            font-size: 1.05rem;
            color: var(--text-body);
            margin-bottom: 2.2rem;
            font-weight: 300;
        }

        .btn-enter {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: #fff;
            padding: 1rem 2.5rem;
            border-radius: 100px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.05rem;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px var(--primary-glow);
        }

        .btn-enter:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px var(--primary-glow);
        }

        /* SECÇÃO DO LIVRO / CARTÃO 3D À DIREITA */
        .book-section {
            flex: 0 0 420px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding-right: 2rem;
        }

        .book-container {
            width: 270px;
            height: 380px;
            perspective: 1200px;
        }

        /* CARTÃO FLUTUANTE COM ROTAÇÃO SUAVE */
        .book-card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            animation: cardFlipSmooth 10s infinite ease-in-out;
            box-shadow: -15px 20px 40px rgba(0, 0, 0, 0.8);
            border-radius: 12px;
        }

        @keyframes cardFlipSmooth {
            0%, 40% {
                transform: rotateY(0deg) translateY(0px);
            }
            50% {
                transform: rotateY(-90deg) translateY(-10px);
            }
            60%, 90% {
                transform: rotateY(-180deg) translateY(0px);
            }
            100% {
                transform: rotateY(-360deg) translateY(0px);
            }
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            backface-visibility: hidden;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2.5rem;
            box-sizing: border-box;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        /* CAPA */
        .card-front {
            background: linear-gradient(135deg, #111827 0%, #030712 100%);
            color: #fff;
            border-left: 8px solid var(--primary);
        }

        .card-front h3 {
            font-family: 'Syne', sans-serif;
            font-size: 1.6rem;
            margin-bottom: 0.75rem;
            color: #ffffff;
        }

        .card-front p {
            font-size: 0.95rem;
            color: var(--text-body);
        }

        /* CONTRACAPA / VERSO */
        .card-back {
            background: linear-gradient(135deg, #0f172a 0%, #020617 100%);
            color: #94a3b8;
            transform: rotateY(180deg);
            border-right: 8px solid var(--accent);
        }

        .card-back p {
            font-size: 0.9rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* RESPONSIVIDADE */
        @media (max-width: 1100px) {
            .left-spacer {
                display: none;
            }
            .page-wrapper {
                justify-content: center;
                flex-wrap: wrap;
            }
            .book-section {
                padding-right: 0;
                justify-content: center;
            }
        }

        @media (max-width: 768px) {
            body {
                background-size: cover;
                background-position: center top;
                padding: 1rem;
            }

            .page-wrapper {
                flex-direction: column;
            }

            .hero {
                padding: 1.75rem 1.25rem;
                background: rgba(10, 12, 16, 0.85);
            }

            .hero-title {
                font-size: 1.8rem;
            }

            .hero-bio {
                font-size: 1rem;
                margin-bottom: 1.75rem;
            }

            .btn-enter {
                width: 100%;
            }

            .book-section {
                order: -1;
                margin-bottom: 1.5rem;
            }

            .book-container {
                width: 200px;
                height: 290px;
            }
        }
    </style>
</head>
<body>

    <div class="glow-bg"></div>

    <div class="page-wrapper">
        
        <!-- ESPAÇADOR À ESQUERDA PARA MOSTRAR A TUA FOTO -->
        <div class="left-spacer"></div>

        <!-- CARTÃO DO AUTOR AO CENTRO -->
        <section class="hero">
            <h1 class="hero-title"><span>Nas sombras, a verdade nunca fica enterrada.</span></h1>
            
            <p class="hero-bio">
                Sou o Bruno Gomes. Escrevo histórias sobre segredos sombrios, mentes complexas e os mistérios que habitam no limiar entre a justiça e a vingança. Prepara-te para duvidar de tudo.
            </p>
            
            <a href="livro.html" class="btn-enter">
                Descobrir o Livro <i class="fa-solid fa-arrow-right"></i>
            </a>
        </section>

        <!-- LIVRO / CARTÃO 3D ELEGANTE À DIREITA -->
        <div class="book-section">
            <div class="book-container">
                <div class="book-card">
                    <!-- FRENTE (Capa) -->
                    <div class="card-face card-front">
                        <h3>Na Teia do Crime</h3>
                        <p>Bruno Gomes</p>
                    </div>
                    <!-- VERSO (Contracapa) -->
                    <div class="card-face card-back">
                        <p>— Contracapa —</p>
                    </div>
                </div>
            </div>
        </div>

    </div>

</body>
</html>
