<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bruno Gomes | Autor de Thriller & Crime</title>
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-main: #0a0c10;
            --border-card: rgba(255, 255, 255, 0.08);
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.35);
            --accent: #a855f7;
            --text-title: #ffffff;
            --text-body: #94a3b8;
            
            /* DIMENSÕES DO LIVRO 3D COM VOLUME REAL */
            --book-w: 230px;
            --book-h: 330px;
            --book-d: 48px; /* Espessura / Profundidade 3D */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-body);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding: 1.5rem;
            position: relative;

            /* IMAGEM DE FUNDO DO AUTOR (À ESQUERDA) */
            background-image: 
                linear-gradient(180deg, rgba(10, 12, 16, 0.70) 0%, rgba(10, 12, 16, 0.88) 100%),
                url('./minha-foto-ia.png');
            background-size: contain;
            background-position: left center;
            background-repeat: no-repeat;
        }

        h1 {
            font-family: 'Syne', sans-serif;
            color: var(--text-title);
        }

        /* BRILHO DE FUNDO */
        .glow-bg {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, var(--primary-glow) 0%, rgba(0,0,0,0) 70%);
            z-index: -1;
            pointer-events: none;
            filter: blur(90px);
        }

        /* CONTENTOR DE LAYOUT COMPLETO */
        .page-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 1500px;
            z-index: 2;
            gap: 2rem;
        }

        /* ESPAÇADOR À ESQUERDA PARA MOSTRAR A TUA FOTO */
        .left-spacer {
            flex: 1;
            min-width: 220px;
        }

        /* CARTÃO DE TEXTO AO CENTRO (HERO) */
        .hero {
            text-align: center;
            padding: 2.5rem;
            width: 100%;
            max-width: 520px;
            background: rgba(10, 12, 16, 0.75);
            border: 1px solid var(--border-card);
            border-radius: 24px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            z-index: 3;
        }

        .hero-title {
            font-size: clamp(1.8rem, 4vw, 3rem);
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        .hero-title span {
            background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-bio {
            font-size: 1.05rem;
            color: var(--text-body);
            margin-bottom: 2.2rem;
            font-weight: 300;
        }

        .btn-enter {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: #fff;
            padding: 1rem 2.5rem;
            border-radius: 100px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.05rem;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px var(--primary-glow);
        }

        .btn-enter:hover {
            transform: translateY(-3px);
            box-shadow: 0 18px 45px var(--primary-glow);
        }

        /* SECÇÃO DO LIVRO 3D VOLUMÉTRICO À DIREITA */
        .book-section {
            flex: 0 0 440px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding-right: 2rem;
        }

        .book-scene {
            width: var(--book-w);
            height: var(--book-h);
            perspective: 1600px;
        }

        /* CAIXA 3D RIGOROSA COM ROTAÇÃO CONTÍNUA */
        .book-box-3d {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transform-origin: center center;
            animation: rotateSolid3D 20s infinite linear;
        }

        @keyframes rotateSolid3D {
            0% {
                transform: rotateX(12deg) rotateY(0deg);
            }
            100% {
                transform: rotateX(12deg) rotateY(-360deg);
            }
        }

        /* FACES DO BLOCO 3D */
        .book-face {
            position: absolute;
            top: 0;
            left: 0;
            box-sizing: border-box;
            backface-visibility: hidden;
        }

        /* 1. CAPA (FRENTE) */
        .face-front {
            width: var(--book-w);
            height: var(--book-h);
            background: linear-gradient(135deg, #111827 0%, #030712 100%);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 4px 10px 10px 4px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2.2rem;
            transform: translateZ(calc(var(--book-d) / 2));
            box-shadow: inset 8px 0 20px rgba(0,0,0,0.7);
            color: #fff;
        }

        .face-front h3 {
            font-family: 'Syne', sans-serif;
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            color: #ffffff;
        }

        .face-front p {
            font-size: 0.9rem;
            color: var(--text-body);
        }

        /* 2. CONTRACAPA (VERSO) */
        .face-back {
            width: var(--book-w);
            height: var(--book-h);
            background: linear-gradient(135deg, #0f172a 0%, #020617 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px 4px 4px 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2.2rem;
            transform: rotateY(180deg) translateZ(calc(var(--book-d) / 2));
            box-shadow: inset -8px 0 20px rgba(0,0,0,0.7);
            color: #64748b;
        }

        .face-back p {
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* 3. LOMBADA (LADO ESQUERDO COM ESPESSURA REAL) */
        .face-spine {
            width: var(--book-d);
            height: var(--book-h);
            left: calc(var(--book-d) / -2);
            background: linear-gradient(90deg, #1e293b 0%, #0f172a 50%, #111827 100%);
            transform: rotateY(-90deg) translateZ(calc(var(--book-w) / 2));
            border-left: 1px solid rgba(255,255,255,0.1);
            border-right: 1px solid rgba(0,0,0,0.5);
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
        }

        /* 4. BLOCO DE PÁGINAS (LADO DIREITO COM TEXTURA DE FOLHAS) */
        .face-pages {
            width: var(--book-d);
            height: calc(var(--book-h) - 4px);
            top: 2px;
            right: calc(var(--book-d) / -2);
            left: auto;
            background: #f8fafc;
            transform: rotateY(90deg) translateZ(calc(var(--book-w) / 2));
            box-shadow: inset 0 0 12px rgba(0,0,0,0.25);
            background-image: repeating-linear-gradient(0deg, #cbd5e1, #cbd5e1 2px, #f8fafc 2px, #f8fafc 4px);
        }

        /* RESPONSIVIDADE */
        @media (max-width: 1100px) {
            .left-spacer {
                display: none;
            }
            .page-wrapper {
                justify-content: center;
                flex-wrap: wrap;
            }
            .book-section {
                padding-right: 0;
                justify-content: center;
            }
        }

        @media (max-width: 768px) {
            :root {
                --book-w: 190px;
                --book-h: 270px;
                --book-d: 38px;
            }

            body {
                background-size: cover;
                background-position: center top;
                padding: 1rem;
            }

            .page-wrapper {
                flex-direction: column;
            }

            .hero {
                padding: 1.75rem 1.25rem;
                background: rgba(10, 12, 16, 0.85);
            }

            .hero-title {
                font-size: 1.8rem;
            }

            .hero-bio {
                font-size: 1rem;
                margin-bottom: 1.75rem;
            }

            .btn-enter {
                width: 100%;
            }

            .book-section {
                order: -1;
                margin-bottom: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <div class="glow-bg"></div>

    <div class="page-wrapper">
        
        <!-- ESPAÇADOR À ESQUERDA PARA MOSTRAR A TUA FOTO -->
        <div class="left-spacer"></div>

        <!-- CARTÃO DO AUTOR AO CENTRO -->
        <section class="hero">
            <h1 class="hero-title"><span>Nas sombras, a verdade nunca fica enterrada.</span></h1>
            
            <p class="hero-bio">
                Sou o Bruno Gomes. Escrevo histórias sobre segredos sombrios, mentes complexas e os mistérios que habitam no limiar entre a justiça e a vingança. Prepara-te para duvidar de tudo.
            </p>
            
            <a href="livro.html" class="btn-enter">
                Descobrir o Livro <i class="fa-solid fa-arrow-right"></i>
            </a>
        </section>

        <!-- LIVRO 3D COM VOLUME FÍSICO REAL E LOMBADA À DIREITA -->
        <div class="book-section">
            <div class="book-scene">
                <div class="book-box-3d">
                    
                    <!-- CAPA (FRENTE) -->
                    <div class="book-face face-front">
                        <h3>Na Teia do Crime</h3>
                        <p>Bruno Gomes</p>
                    </div>

                    <!-- CONTRACAPA (VERSO) -->
                    <div class="book-face face-back">
                        <p>— Contracapa —</p>
                    </div>

                    <!-- LOMBADA -->
                    <div class="book-face face-spine"></div>

                    <!-- BLOCO DE PÁGINAS LATERAIS -->
                    <div class="book-face face-pages"></div>

                </div>
            </div>
        </div>

    </div>

</body>
</html>
