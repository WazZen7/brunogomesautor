<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apresentação</title>
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-main: #0a0c10;
            --border-card: rgba(255, 255, 255, 0.08);
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.35);
            --accent: #a855f7;
            --text-title: #ffffff;
            --text-body: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-body);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding: 1.5rem;

            /* IMAGEM DE FUNDO PARA COMPUTADOR (DESKTOP) */
            background-image: 
                linear-gradient(180deg, rgba(10, 12, 16, 0.70) 0%, rgba(10, 12, 16, 0.88) 100%),
                url('./minha-foto-ia.jpg.jpg');
            background-size: contain;
            background-position: left center;
            background-repeat: no-repeat;
        }

        h1 {
            font-family: 'Syne', sans-serif;
            color: var(--text-title);
        }

        /* BRILHO DE FUNDO */
        .glow-bg {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, var(--primary-glow) 0%, rgba(0,0,0,0) 70%);
            z-index: -1;
            pointer-events: none;
            filter: blur(90px);
        }

        .hero {
            text-align: center;
            padding: 2.5rem;
            width: 100%;
            max-width: 650px;
            z-index: 2;
            background: rgba(10, 12, 16, 0.55);
            border: 1px solid var(--border-card);
            border-radius: 24px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .hero-title {
            font-size: clamp(2rem, 5vw, 3.8rem);
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        .hero-title span {
            background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-bio {
            font-size: 1.15rem;
            color: var(--text-body);
            margin-bottom: 2.5rem;
            font-weight: 300;
        }

        .btn-enter {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: #fff;
            padding: 1rem 2.5rem;
            border-radius: 100px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.05rem;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px var(--primary-glow);
        }

        .btn-enter:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px var(--primary-glow);
        }

        /* REGRAS ESPECÍFICAS PARA DISPOSITIVOS MÓVEIS (TELEMÓVEIS E TABLETS) */
        @media (max-width: 768px) {
            body {
                /* No telemóvel, a imagem cobre a tela inteira com foco no topo para não cortar a cabeça */
                background-size: cover;
                background-position: center top;
                padding: 1rem;
            }

            .hero {
                padding: 1.75rem 1.25rem;
                background: rgba(10, 12, 16, 0.75); /* Fundo um pouco mais escuro para garantir boa leitura no telemóvel */
            }

            .hero-title {
                font-size: 1.8rem;
            }

            .hero-bio {
                font-size: 1rem;
                margin-bottom: 1.75rem;
            }

            .btn-enter {
                width: 100%; /* Botão ocupa a largura total no telemóvel para facilitar o clique */
                padding: 0.9rem 1.5rem;
            }
        }
    </style>
</head>
<body>

    <div class="glow-bg"></div>

    <section class="hero">
        <h1 class="hero-title"><span>Olá, sou o [O Teu Nome].</span></h1>
        
        <p class="hero-bio">
            Aqui podes escrever quem és, a tua profissão, paixões ou uma breve frase sobre o motivo de teres criado este projeto.
        </p>
        
        <!-- Ao clicar, vai para a segunda página (livro.html) -->
        <a href="livro.html" class="btn-enter">
            Entrar no Site <i class="fa-solid fa-arrow-right"></i>
        </a>
    </section>

</body>
</html>
