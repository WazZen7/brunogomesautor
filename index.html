<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bruno Gomes | Autor de Thriller & Crime</title>
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-main: #0a0c10;
            --border-card: rgba(255, 255, 255, 0.08);
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.35);
            --accent: #a855f7;
            --text-title: #ffffff;
            --text-body: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-body);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding: 1.5rem;
            position: relative;

            /* IMAGEM DE FUNDO DO AUTOR (À ESQUERDA) */
            background-image: 
                linear-gradient(180deg, rgba(10, 12, 16, 0.70) 0%, rgba(10, 12, 16, 0.88) 100%),
                url('./minha-foto-ia.png');
            background-size: contain;
            background-position: left center;
            background-repeat: no-repeat;
        }

        h1 {
            font-family: 'Syne', sans-serif;
            color: var(--text-title);
        }

        /* BRILHO DE FUNDO */
        .glow-bg {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, var(--primary-glow) 0%, rgba(0,0,0,0) 70%);
            z-index: -1;
            pointer-events: none;
            filter: blur(90px);
        }

        /* CONTENTOR DE LAYOUT COMPLETO */
        .page-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 1200px;
            z-index: 2;
            gap: 2rem;
        }

        /* COLUNA VAZIA PARA EQUILIBRAR O ESPAÇO DA FOTO À ESQUERDA */
        .left-spacer {
            flex: 1;
        }

        /* CARTÃO DE TEXTO AO MEIO (HERO) */
        .hero {
            text-align: center;
            padding: 2.5rem;
            width: 100%;
            max-width: 580px;
            background: rgba(10, 12, 16, 0.65);
            border: 1px solid var(--border-card);
            border-radius: 24px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .hero-title {
            font-size: clamp(2rem, 4.5vw, 3.5rem);
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        .hero-title span {
            background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-bio {
            font-size: 1.1rem;
            color: var(--text-body);
            margin-bottom: 2.2rem;
            font-weight: 300;
        }

        .btn-enter {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: #fff;
            padding: 1rem 2.5rem;
            border-radius: 100px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.05rem;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px var(--primary-glow);
        }

        .btn-enter:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px var(--primary-glow);
        }

        /* LIVRO 3D SOZINHO À DIREIRA */
        .book-section {
            flex: 0 0 260px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .book-3d {
            width: 200px;
            height: 290px;
            position: relative;
            perspective: 1000px;
        }

        .book-body {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            box-shadow: -15px 15px 30px rgba(0, 0, 0, 0.7);
            border-radius: 4px 8px 8px 4px;
            background: #0b0f17;
        }

        /* ESTRUTURA DE PÁGINAS QUE FOLHEIAM SEQUENCIALMENTE */
        .paper-sheet {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            transform-origin: left center;
            transform-style: preserve-3d;
            border-radius: 2px 8px 8px 2px;
            animation: flipSequence 10s infinite cubic-bezier(0.4, 0, 0.2, 1);
        }

        .sheet-front, .sheet-back {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            backface-visibility: hidden;
            border-radius: 2px 8px 8px 2px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 1.5rem;
            box-sizing: border-box;
        }

        .sheet-back {
            transform: rotateY(180deg);
        }

        /* CAPA FRONTAL (COMEÇO) */
        .cover-front-style {
            background: linear-gradient(135deg, #111827 0%, #030712 100%);
            border-left: 6px solid #374151;
            border: 1px solid rgba(255,255,255,0.12);
            text-align: center;
            color: #fff;
            align-items: center;
            box-shadow: inset 4px 0 10px rgba(0,0,0,0.5);
        }

        .cover-front-style h3 {
            font-family: 'Syne', sans-serif;
            font-size: 1.2rem;
            margin-bottom: 0.4rem;
        }

        .cover-front-style p {
            font-size: 0.8rem;
            color: var(--text-body);
        }

        /* PÁGINAS INTERNAS (FOLHAS EM BRANCO COM LINHAS) */
        .page-inner-style {
            background: #f1f5f9;
            box-shadow: inset 3px 0 10px rgba(0,0,0,0.08);
        }

        .line-sim {
            height: 4px;
            background: #cbd5e1;
            margin-bottom: 8px;
            border-radius: 2px;
        }
        .line-sim.short { width: 55%; }
        .line-sim.med { width: 80%; }

        /* CONTRACAPA FINAL (FECHO DO LIVRO) */
        .cover-back-style {
            background: linear-gradient(135deg, #0f172a 0%, #020617 100%);
            border-right: 6px solid #374151;
            border: 1px solid rgba(255,255,255,0.1);
            text-align: center;
            color: #475569;
            align-items: center;
            box-shadow: inset -4px 0 10px rgba(0,0,0,0.5);
        }

        /* CRONOGRAMA DAS FOLHAS (CAPA -> PÁGINAS -> CONTRACAPA) */
        .sheet-1 { z-index: 5; animation-delay: 0s; }
        .sheet-2 { z-index: 4; animation-delay: 1.8s; }
        .sheet-3 { z-index: 3; animation-delay: 3.6s; }
        .sheet-4 { z-index: 2; animation-delay: 5.4s; }

        @keyframes flipSequence {
            0% {
                transform: rotateY(0deg);
            }
            18% {
                transform: rotateY(-180deg);
            }
            70% {
                transform: rotateY(-180deg);
            }
            88% {
                transform: rotateY(0deg);
            }
            100% {
                transform: rotateY(0deg);
            }
        }

        /* AJUSTES RESPONSIVOS */
        @media (max-width: 1024px) {
            .left-spacer {
                display: none;
            }
            .page-wrapper {
                justify-content: center;
                flex-wrap: wrap;
            }
        }

        @media (max-width: 768px) {
            body {
                background-size: cover;
                background-position: center top;
                padding: 1rem;
            }

            .page-wrapper {
                flex-direction: column;
            }

            .hero {
                padding: 1.75rem 1.25rem;
                background: rgba(10, 12, 16, 0.80);
            }

            .hero-title {
                font-size: 1.8rem;
            }

            .hero-bio {
                font-size: 1rem;
                margin-bottom: 1.75rem;
            }

            .btn-enter {
                width: 100%;
            }

            .book-section {
                order: -1; /* No telemóvel o livro fica no topo */
                margin-bottom: 1rem;
            }

            .book-3d {
                width: 160px;
                height: 230px;
            }
        }
    </style>
</head>
<body>

    <div class="glow-bg"></div>

    <div class="page-wrapper">
        
        <!-- ESPAÇADOR À ESQUERDA PARA A TUA FOTO DE FUNDO FICAR VISÍVEL -->
        <div class="left-spacer"></div>

        <!-- CARTÃO DO AUTOR AO CENTRO DA PÁGINA -->
        <section class="hero">
            <h1 class="hero-title"><span>Nas sombras, a verdade nunca fica enterrada.</span></h1>
            
            <p class="hero-bio">
                Sou o Bruno Gomes. Escrevo histórias sobre segredos sombrios, mentes complexas e os mistérios que habitam no limiar entre a justiça e a vingança. Prepara-te para duvidar de tudo.
            </p>
            
            <a href="livro.html" class="btn-enter">
                Descobrir o Livro <i class="fa-solid fa-arrow-right"></i>
            </a>
        </section>

        <!-- LIVRO 3D ANIMADO SOZINHO À DIREITA -->
        <div class="book-section">
            <div class="book-3d">
                <div class="book-body">
                    
                    <!-- FOLHA 1: CAPA FRONTAL -> PÁGINA 1 -->
                    <div class="paper-sheet sheet-1">
                        <div class="sheet-front cover-front-style">
                            <h3>Na Teia do Crime</h3>
                            <p>Bruno Gomes</p>
                        </div>
                        <div class="sheet-back page-inner-style">
                            <div class="line-sim med"></div>
                            <div class="line-sim"></div>
                            <div class="line-sim short"></div>
                        </div>
                    </div>

                    <!-- FOLHA 2: PÁGINAS INTERNAS 2 E 3 -->
                    <div class="paper-sheet sheet-2">
                        <div class="sheet-front page-inner-style">
                            <div class="line-sim"></div>
                            <div class="line-sim short"></div>
                            <div class="line-sim med"></div>
                        </div>
                        <div class="sheet-back page-inner-style">
                            <div class="line-sim med"></div>
                            <div class="line-sim"></div>
                            <div class="line-sim"></div>
                        </div>
                    </div>

                    <!-- FOLHA 3: PÁGINAS INTERNAS 4 E 5 -->
                    <div class="paper-sheet sheet-3">
                        <div class="sheet-front page-inner-style">
                            <div class="line-sim med"></div>
                            <div class="line-sim short"></div>
                            <div class="line-sim"></div>
                        </div>
                        <div class="sheet-back page-inner-style">
                            <div class="line-sim"></div>
                            <div class="line-sim short"></div>
                            <div class="line-sim med"></div>
                        </div>
                    </div>

                    <!-- FOLHA 4: PÁGINA FINAL -> CONTRACAPA -->
                    <div class="paper-sheet sheet-4">
                        <div class="sheet-front page-inner-style">
                            <div class="line-sim"></div>
                            <div class="line-sim med"></div>
                            <div class="line-sim short"></div>
                        </div>
                        <div class="sheet-back cover-back-style">
                            <p>— Contracapa —</p>
                        </div>
                    </div>

                </div>
            </div>
        </div>

    </div>

</body>
</html>
