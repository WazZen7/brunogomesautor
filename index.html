<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bruno Gomes | Autor de Thriller & Crime</title>
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-main: #0a0c10;
            --border-card: rgba(255, 255, 255, 0.08);
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.35);
            --accent: #a855f7;
            --text-title: #ffffff;
            --text-body: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-body);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding: 1.5rem;

            /* IMAGEM DE FUNDO INVESTIGATIVA */
            background-image: 
                linear-gradient(180deg, rgba(10, 12, 16, 0.75) 0%, rgba(10, 12, 16, 0.90) 100%),
                url('./minha-foto-ia.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        h1 {
            font-family: 'Syne', sans-serif;
            color: var(--text-title);
        }

        /* BRILHO DE FUNDO */
        .glow-bg {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, var(--primary-glow) 0%, rgba(0,0,0,0) 70%);
            z-index: -1;
            pointer-events: none;
            filter: blur(90px);
        }

        /* CONTENTOR PRINCIPAL DE DUAS COLUNAS */
        .main-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3rem;
            max-width: 1100px;
            width: 100%;
            z-index: 2;
        }

        /* LIVRO 3D ANIMADO */
        .book-wrapper {
            perspective: 1200px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .book {
            width: 200px;
            height: 280px;
            position: relative;
            transform-style: preserve-3d;
            transform: rotateX(15deg) rotateY(-20deg);
            transition: transform 0.5s ease;
            box-shadow: -20px 20px 40px rgba(0,0,0,0.6);
            border-radius: 4px 8px 8px 4px;
        }

        .book:hover {
            transform: rotateX(0deg) rotateY(0deg);
        }

        .book-face {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            backface-visibility: hidden;
            border-radius: 4px 8px 8px 4px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 1.5rem;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .book-cover {
            z-index: 5;
            background: linear-gradient(135deg, #111827 0%, #030712 100%);
            border-left: 6px solid #374151;
            box-shadow: inset 5px 0 15px rgba(0,0,0,0.5);
        }

        .book-cover h3 {
            font-family: 'Syne', sans-serif;
            color: #fff;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }

        .book-cover p {
            font-size: 0.8rem;
            color: var(--text-body);
        }

        /* PÁGINAS ANIMADAS */
        .page {
            position: absolute;
            top: 2px;
            left: 2px;
            width: calc(100% - 4px);
            height: calc(100% - 4px);
            background: #f8fafc;
            color: #1e293b;
            border-radius: 2px 6px 6px 2px;
            transform-origin: left center;
            transform-style: preserve-3d;
            animation: pageTurn 6s infinite ease-in-out;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 1.2rem;
            box-shadow: inset 2px 0 10px rgba(0,0,0,0.05);
        }

        .page:nth-child(2) { animation-delay: 2s; z-index: 3; }
        .page:nth-child(3) { animation-delay: 4s; z-index: 2; }

        .page-lines {
            width: 100%;
            height: 4px;
            background: #cbd5e1;
            margin-bottom: 8px;
            border-radius: 2px;
        }
        .page-lines.short { width: 60%; }
        .page-lines.medium { width: 80%; }

        @keyframes pageTurn {
            0% { transform: rotateY(0deg); }
            30% { transform: rotateY(-160deg); }
            50% { transform: rotateY(-180deg); }
            80% { transform: rotateY(-180deg); }
            100% { transform: rotateY(0deg); }
        }

        /* CAIXA HERO (LADO DIREITO) */
        .hero {
            text-align: left;
            padding: 2.5rem;
            width: 100%;
            max-width: 600px;
            z-index: 2;
            background: rgba(10, 12, 16, 0.70);
            border: 1px solid var(--border-card);
            border-radius: 24px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .hero-title {
            font-size: clamp(1.8rem, 4vw, 3rem);
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        .hero-title span {
            background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-bio {
            font-size: 1.05rem;
            color: var(--text-body);
            margin-bottom: 2rem;
            font-weight: 300;
        }

        .btn-enter {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: #fff;
            padding: 1rem 2.5rem;
            border-radius: 100px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.05rem;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px var(--primary-glow);
        }

        .btn-enter:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px var(--primary-glow);
        }

        /* AJUSTES RESPONSIVOS PARA TELEMÓVEIS */
        @media (max-width: 900px) {
            .main-container {
                flex-direction: column;
                gap: 2rem;
            }

            body {
                padding: 1rem;
            }

            .hero {
                text-align: center;
                padding: 1.75rem 1.25rem;
            }

            .btn-enter {
                width: 100%;
            }

            .book {
                width: 160px;
                height: 220px;
            }
        }
    </style>
</head>
<body>

    <div class="glow-bg"></div>

    <div class="main-container">
        <!-- LIVRO 3D ANIMADO À ESQUERDA -->
        <div class="book-wrapper">
            <div class="book">
                <!-- Capa do Livro (Podes substituir o conteúdo ou colocar imagem futuramente) -->
                <div class="book-face book-cover">
                    <h3>Na Teia do Crime</h3>
                    <p>Bruno Gomes</p>
                </div>
                <!-- Páginas Internas Simuladas a Folhear -->
                <div class="page">
                    <div class="page-lines medium"></div>
                    <div class="page-lines"></div>
                    <div class="page-lines short"></div>
                    <div class="page-lines medium"></div>
                </div>
                <div class="page">
                    <div class="page-lines"></div>
                    <div class="page-lines short"></div>
                    <div class="page-lines medium"></div>
                </div>
            </div>
        </div>

        <!-- CONTEÚDO PRINCIPAL À DIREITA -->
        <section class="hero">
            <h1 class="hero-title"><span>Nas sombras, a verdade nunca fica enterrada.</span></h1>
            
            <p class="hero-bio">
                Sou o Bruno Gomes. Escrevo histórias sobre segredos sombrios, mentes complexas e os mistérios que habitam no limiar entre a justiça e a vingança. Prepara-te para duvidar de tudo.
            </p>
            
            <!-- Ao clicar, vai para a segunda página (livro.html) -->
            <a href="livro.html" class="btn-enter">
                Descobrir o Livro <i class="fa-solid fa-arrow-right"></i>
            </a>
        </section>
    </div>

</body>
</html>
