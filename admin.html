<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Moderação | Bruno Gomes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-main: #0a0c10;
            --bg-card: rgba(10, 12, 16, 0.75);
            --border-card: rgba(255, 255, 255, 0.08);
            --primary: #6366f1;
            --text-title: #ffffff;
            --text-body: #94a3b8;
            --success: #22c55e;
            --danger: #ef4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-body);
            padding: 2rem 1.5rem;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-card);
        }

        h1 { font-family: 'Syne', sans-serif; color: var(--text-title); font-size: 1.8rem; }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .author-name { font-weight: 700; color: #fff; }
        .rating { color: #f59e0b; }
        .message-text { color: #cbd5e1; font-size: 0.95rem; }
        .date-text { font-size: 0.75rem; color: #64748b; }

        .actions {
            display: flex;
            gap: 0.75rem;
            margin-top: 0.5rem;
        }

        .btn {
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            transition: opacity 0.2s;
        }

        .btn:hover { opacity: 0.85; }
        .btn-approve { background: var(--success); color: #fff; }
        .btn-delete { background: rgba(239, 68, 68, 0.2); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.4); }

        .empty-state {
            text-align: center;
            padding: 3rem;
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 16px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Painel de Moderação</h1>
            <a href="/livro" style="color: var(--primary); text-decoration: none;">Ver Site <i class="fa-solid fa-arrow-up-right-from-square"></i></a>
        </header>

        <h2 style="margin-bottom: 1rem; font-size: 1.2rem; color: #fff;">Comentários Pendentes</h2>
        <div id="pendingContainer">
            <p>A carregar comentários...</p>
        </div>
    </div>

    <script>
        const SB_URL = 'https://smhlkdzyllquzirwkmqw.supabase.co';
        const SB_KEY = 'sb_publishable_pD7dPVlj7eU4tyFMt7gWPA_yd-QVGze';

        const container = document.getElementById('pendingContainer');

        async function loadPending() {
            try {
                const response = await fetch(`${SB_URL}/rest/v1/comentarios?aprovado=eq.false&order=created_at.desc`, {
                    headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}` }
                });
                const comentarios = await response.json();

                if (!comentarios || comentarios.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="fa-solid fa-check-circle" style="font-size: 2rem; color: var(--success); margin-bottom: 0.5rem; display: block;"></i>
                            <p>Não há comentários pendentes para aprovação!</p>
                        </div>`;
                    return;
                }

                container.innerHTML = comentarios.map(item => `
                    <div class="card" id="card-${item.id}">
                        <div class="card-header">
                            <span class="author-name">${escapeHtml(item.nome)}</span>
                            <span class="rating">${'⭐'.repeat(item.avaliacao)}</span>
                        </div>
                        <p class="message-text">${escapeHtml(item.mensagem)}</p>
                        <span class="date-text">${new Date(item.created_at).toLocaleString('pt-PT')}</span>
                        <div class="actions">
                            <button class="btn btn-approve" onclick="approveReview(${item.id})">
                                <i class="fa-solid fa-check"></i> Aprovar
                            </button>
                            <button class="btn btn-delete" onclick="deleteReview(${item.id})">
                                <i class="fa-solid fa-trash"></i> Eliminar
                            </button>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                container.innerHTML = '<p>Erro ao carregar comentários.</p>';
            }
        }

        async function approveReview(id) {
            const res = await fetch(`${SB_URL}/rest/v1/comentarios?id=eq.${id}`, {
                method: 'PATCH',
                headers: {
                    'apikey': SB_KEY,
                    'Authorization': `Bearer ${SB_KEY}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ aprovado: true })
            });

            if (res.ok) {
                document.getElementById(`card-${id}`)?.remove();
                if (container.children.length === 0) loadPending();
            } else {
                alert('Erro ao aprovar comentário.');
            }
        }

        async function deleteReview(id) {
            if (!confirm('Tem a certeza que deseja eliminar este comentário?')) return;

            const res = await fetch(`${SB_URL}/rest/v1/comentarios?id=eq.${id}`, {
                method: 'DELETE',
                headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}` }
            });

            if (res.ok) {
                document.getElementById(`card-${id}`)?.remove();
                if (container.children.length === 0) loadPending();
            } else {
                alert('Erro ao eliminar comentário.');
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        loadPending();
    </script>
</body>
</html>
