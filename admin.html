<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Moderação | Bruno Gomes</title>
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-main: #07090e;
            --bg-card: rgba(13, 17, 26, 0.85);
            --border-card: rgba(255, 255, 255, 0.08);
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.35);
            --accent: #a855f7;
            --text-title: #ffffff;
            --text-body: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-body);
            min-height: 100vh;
            padding: 2rem;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        /* ECRÃ DE LOGIN BLOQUEADO */
        #loginOverlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(7, 9, 14, 0.95);
            backdrop-filter: blur(16px);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        .login-card {
            background: #0f131a;
            border: 1px solid var(--border-card);
            border-radius: 24px;
            padding: 2.5rem;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        .login-card i.lock-icon {
            font-size: 2.5rem;
            color: var(--primary);
            margin-bottom: 1rem;
        }

        .login-card h2 {
            font-family: 'Syne', sans-serif;
            color: #fff;
            font-size: 1.6rem;
            margin-bottom: 0.5rem;
        }

        .login-card p {
            font-size: 0.88rem;
            margin-bottom: 1.5rem;
            color: var(--text-body);
        }

        .input-field {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-card);
            border-radius: 12px;
            padding: 0.85rem 1.25rem;
            color: #fff;
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            margin-bottom: 1rem;
            text-align: center;
            transition: border-color 0.3s ease;
        }

        .input-field:focus { border-color: var(--primary); }

        .btn-primary {
            width: 100%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: #fff;
            padding: 0.9rem;
            border-radius: 100px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px var(--primary-glow);
        }

        .btn-primary:hover { transform: translateY(-2px); }

        /* CONTEÚDO DO PAINEL DE ADMIN */
        #adminContent {
            display: none;
            width: 100%;
            max-width: 1000px;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-card);
        }

        .btn-logout {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
            padding: 0.5rem 1.2rem;
            border-radius: 100px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-logout:hover { background: rgba(239, 68, 68, 0.3); }

        .section-title {
            font-family: 'Syne', sans-serif;
            color: #fff;
            font-size: 1.4rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .item-card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 16px;
            padding: 1.25rem 1.5rem;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        .btn-approve {
            background: #10b981;
            color: #fff;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-delete {
            background: #ef4444;
            color: #fff;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- OVERLAY DE LOGIN COM AUTENTICAÇÃO -->
    <div id="loginOverlay">
        <div class="login-card">
            <i class="fa-solid fa-lock lock-icon"></i>
            <h2>Área Reservada</h2>
            <p>Acesso restrito ao Autor para moderação de comentários e encomendas.</p>
            
            <form id="loginForm" onsubmit="handleLogin(event)">
                <input type="password" id="adminPassword" class="input-field" placeholder="Digita a Palavra-passe" required autofocus>
                <button type="submit" class="btn-primary">
                    <i class="fa-solid fa-key"></i> Entrar no Painel
                </button>
            </form>
            <p id="loginError" style="color: #ef4444; font-size: 0.82rem; margin-top: 1rem; display: none;">
                Palavra-passe incorreta. Tenta novamente.
            </p>
        </div>
    </div>

    <!-- CONTEÚDO PROTEGIDO DO PAINEL -->
    <div id="adminContent">
        <header class="admin-header">
            <div>
                <h1 style="font-family: 'Syne', sans-serif; color: #fff; font-size: 1.8rem;">Painel de Moderação</h1>
                <p style="font-size: 0.88rem; color: var(--text-body);">Gestão de Opiniões e Encomendas</p>
            </div>
            <button class="btn-logout" onclick="handleLogout()">
                <i class="fa-solid fa-right-from-bracket"></i> Sair
            </button>
        </header>

        <!-- SEÇÃO DE COMENTÁRIOS PENDENTES -->
        <section style="margin-bottom: 3rem;">
            <h2 class="section-title"><i class="fa-solid fa-comments" style="color: var(--primary);"></i> Opiniões Pendentes</h2>
            <div id="pendingReviewsContainer"></div>
        </section>

        <!-- SEÇÃO DE ENCOMENDAS REGISTADAS -->
        <section>
            <h2 class="section-title"><i class="fa-solid fa-box" style="color: var(--accent);"></i> Encomendas do Livro</h2>
            <div id="ordersContainer"></div>
        </section>
    </div>

    <script>
        // PALAVRA-PASSE DE ACESSO AO PAINEL
        const ADMIN_PASSWORD = "6907"; 

        const SB_URL = 'https://smhlkdzyllquzirwkmqw.supabase.co';
        const SB_KEY = 'sb_publishable_pD7dPVlj7eU4tyFMt7gWPA_yd-QVGze';

        // VERIFICA SE JÁ EXISTE SESSÃO ATIVA AO CARREGAR A PÁGINA
        window.addEventListener('DOMContentLoaded', () => {
            if (sessionStorage.getItem('adminAuthorized') === 'true') {
                showAdminPanel();
            }
        });

        function handleLogin(e) {
            e.preventDefault();
            const passInput = document.getElementById('adminPassword').value;
            const errorMsg = document.getElementById('loginError');

            if (passInput === ADMIN_PASSWORD) {
                sessionStorage.setItem('adminAuthorized', 'true');
                errorMsg.style.display = 'none';
                showAdminPanel();
            } else {
                errorMsg.style.display = 'block';
                document.getElementById('adminPassword').value = '';
            }
        }

        function showAdminPanel() {
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('adminContent').style.display = 'block';
            loadPendingReviews();
            loadOrders();
        }

        function handleLogout() {
            sessionStorage.removeItem('adminAuthorized');
            location.reload();
        }

        // CARREGAR COMENTÁRIOS PENDENTES PARA APROVAÇÃO
        async function loadPendingReviews() {
            const container = document.getElementById('pendingReviewsContainer');
            try {
                const response = await fetch(`${SB_URL}/rest/v1/comentarios?aprovado=eq.false&order=created_at.desc`, {
                    headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}` }
                });
                const list = await response.json();

                if (!list || list.length === 0) {
                    container.innerHTML = '<p style="font-size:0.9rem;">Sem opiniões pendentes de aprovação.</p>';
                    return;
                }

                container.innerHTML = list.map(item => `
                    <div class="item-card">
                        <div>
                            <strong style="color: #fff;">${escapeHtml(item.nome)}</strong> (${'⭐'.repeat(item.avaliacao)})
                            <p style="font-size: 0.9rem; margin-top: 4px;">${escapeHtml(item.mensagem)}</p>
                        </div>
                        <div style="display: flex; gap: 0.5rem;">
                            <button class="btn-approve" onclick="approveReview('${item.id}')">Aprovar</button>
                            <button class="btn-delete" onclick="deleteReview('${item.id}')">Apagar</button>
                        </div>
                    </div>
                `).join('');
            } catch (err) { console.error(err); }
        }

        async function approveReview(id) {
            await fetch(`${SB_URL}/rest/v1/comentarios?id=eq.${id}`, {
                method: 'PATCH',
                headers: {
                    'apikey': SB_KEY,
                    'Authorization': `Bearer ${SB_KEY}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ aprovado: true })
            });
            loadPendingReviews();
        }

        async function deleteReview(id) {
            if (!confirm('Confirmar eliminação?')) return;
            await fetch(`${SB_URL}/rest/v1/comentarios?id=eq.${id}`, {
                method: 'DELETE',
                headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}` }
            });
            loadPendingReviews();
        }

        // CARREGAR ENCOMENDAS REGISTADAS
        async function loadOrders() {
            const container = document.getElementById('ordersContainer');
            try {
                const response = await fetch(`${SB_URL}/rest/v1/encomendas?order=created_at.desc`, {
                    headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}` }
                });
                const list = await response.json();

                if (!list || list.length === 0) {
                    container.innerHTML = '<p style="font-size:0.9rem;">Sem encomendas registadas até ao momento.</p>';
                    return;
                }

                container.innerHTML = list.map(item => `
                    <div class="item-card" style="flex-direction: column; align-items: flex-start; gap: 0.5rem;">
                        <div style="display: flex; justify-content: space-between; width: 100%;">
                            <strong style="color: #fff; font-size: 1.05rem;">${escapeHtml(item.nome)}</strong>
                            <span style="color: var(--primary); font-weight: 700;">${item.total ? item.total + '€' : ''}</span>
                        </div>
                        <p style="font-size: 0.88rem;"><strong>Telemóvel:</strong> ${escapeHtml(item.telemovel)} | <strong>Pagamento:</strong> ${escapeHtml(item.metodo_pagamento)}</p>
                        <p style="font-size: 0.88rem; color: #cbd5e1;"><strong>Morada:</strong> ${escapeHtml(item.morada)}</p>
                    </div>
                `).join('');
            } catch (err) { console.error(err); }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
